# Copy to watch.toml. state.json is written next to this file.
limit = 50        # results per API page
max_pages = 4     # pages per search per run (stops early once a page is all known)

# Search for a plain string or an object if you need extra filters.
# Keys: exclude, require, nsfw (default: false)
# Keep this list above [mail]!
search = [
  "sonicare",
  "ikea ivar",
  { query = "gridfinity", exclude = ["bin", "baseplate"], require = ["holder", "mount"] },
]

[mail]
from = "printables@tonks.rixx.de"
to = "rixx@example.com"
# host = "localhost"
# subject = "Printables: {total} new models"
